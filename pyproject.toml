[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-risk-lab"
version = "0.1.0"
description = "Portfolio rebalancing and uncertainty-aware risk budgeting for decision support"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Garros Gong"}]
keywords = ["portfolio optimization", "risk budgeting", "scenario robustness", "decision support"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10"]

[project.optional-dependencies]
market = ["yfinance>=0.2.40"]
dev = ["pytest>=8", "build>=1.2"]

[project.scripts]
portfolio-risk-lab = "portfolio_risk_lab.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["portfolio_risk_lab", "portfolio_risk_lab.*"]
exclude = ["src*", "tests*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests_package"]
addopts = "-q"
